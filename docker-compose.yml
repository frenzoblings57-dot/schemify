# Pocket Beta sandbox deployment.
# Bound to the Docker bridge gateway so the operator's Beta supplier
# (running in the host's root Docker) can reach it at 172.17.0.1:28080.
# Local runs: change the bind address back to 127.0.0.1.
services:
  schemify:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-dev}
    image: schemify:${SCHEMIFY_TAG:-dev}
    restart: unless-stopped
    environment:
      PORT: "8080"
    ports:
      - "172.17.0.1:${SCHEMIFY_HOST_PORT:-28080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
